<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Phân tích Cổ phiếu Việt Nam{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <h1>📊 Stock Analyzer</h1>
            </div>
            <div class="nav-links">
                <a href="{{ url_for('index') }}" class="nav-link">Trang chủ</a>
                {% if username %}
                <div class="user-panel" style="display: inline-block; margin-left: 20px;">
                    <span style="color: #1e293b; margin-right: 10px;">Xin chào, <strong>{{ username }}</strong>!</span>
                    <a href="{{ url_for('logout') }}" class="nav-link" style="color: #ff6b6b; font-weight: 500;">Đăng
                        xuất</a>
                </div>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Stock Analysis Tool | Nguồn dữ liệu: VCI</p>
        </div>
    </footer>
</body>

</html>
